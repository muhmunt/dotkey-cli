version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./main.go
    binary: dotkey
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X dotkey-cli/internal/config.Version={{.Version}}

archives:
  - id: default
    name_template: "dotkey_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: muhmunt
    name: dotkey-cli
  name_template: "v{{.Version}}"
  prerelease: auto
